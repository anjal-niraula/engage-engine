version: '3'

vars:
  APP_NAME: engage-engine
  BIN_DIR: bin
  API_BIN: '{{.BIN_DIR}}/api'
  WORKER_BIN: '{{.BIN_DIR}}/worker'
  SEED_BIN: '{{.BIN_DIR}}/seed'
  SIMULATE_BIN: '{{.BIN_DIR}}/simulate'
  API_ENTRY: cmd/api/main.go
  WORKER_ENTRY: cmd/worker/main.go
  SEED_ENTRY: cmd/seed/main.go
  SIMULATE_ENTRY: cmd/simulate/main.go

dotenv: ['.env', '.env.example']

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  all:
    desc: Clean, format, vet, test, and build all binaries
    cmds:
      - task: clean
      - task: fmt
      - task: vet
      - task: test
      - task: build

  build:
    desc: Build all service binaries
    deps: [build-api, build-worker, build-seed, build-simulate]

  build-api:
    desc: Build the API server binary
    generates:
      - '{{.API_BIN}}'
    sources:
      - 'cmd/api/**/*.go'
      - 'internal/**/*.go'
      - 'go.mod'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.API_BIN}} {{.API_ENTRY}}

  build-worker:
    desc: Build the worker service binary
    generates:
      - '{{.WORKER_BIN}}'
    sources:
      - 'cmd/worker/**/*.go'
      - 'internal/**/*.go'
      - 'go.mod'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.WORKER_BIN}} {{.WORKER_ENTRY}}

  build-seed:
    desc: Build the seed & simulation CLI binary
    generates:
      - '{{.SEED_BIN}}'
    sources:
      - 'cmd/seed/**/*.go'
      - 'go.mod'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.SEED_BIN}} {{.SEED_ENTRY}}

  build-simulate:
    desc: Build the high-throughput load simulator binary
    generates:
      - '{{.SIMULATE_BIN}}'
    sources:
      - 'cmd/simulate/**/*.go'
      - 'go.mod'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.SIMULATE_BIN}} {{.SIMULATE_ENTRY}}

  seed:
    desc: Seed database and simulate live social engagement
    cmds:
      - go run {{.SEED_ENTRY}}

  simulate:
    desc: Run high-throughput simulation (views, comments, Kafka & Redis HLL)
    cmds:
      - go run {{.SIMULATE_ENTRY}} -views 2000 -comments 200 -likes 50

  run-api:
    desc: Run the HTTP API server directly
    cmds:
      - go run {{.API_ENTRY}}

  run-worker:
    desc: Run the background worker service directly
    cmds:
      - go run {{.WORKER_ENTRY}}

  test:
    desc: Run unit tests with race detection
    cmds:
      - go test -v -race ./...

  test-integration:
    desc: Run integration tests against running infrastructure (Docker)
    cmds:
      - go test -v -race -tags=integration ./tests/integration/...

  test-coverage:
    desc: Run unit tests and generate HTML coverage report
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go test -v -race -coverprofile={{.BIN_DIR}}/coverage.out ./...
      - go tool cover -html={{.BIN_DIR}}/coverage.out -o {{.BIN_DIR}}/coverage.html
      - echo "Coverage report generated at {{.BIN_DIR}}/coverage.html"

  fmt:
    desc: Format all Go source files
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet static analysis
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run
    ignore_error: true

  clean:
    desc: Clean build artifacts and coverage files
    cmds:
      - rm -rf {{.BIN_DIR}}

  docker-build:
    desc: Build Docker images for API and worker
    cmds:
      - docker build -f deployments/docker/Dockerfile.api -t {{.APP_NAME}}-api:latest .
      - docker build -f deployments/docker/Dockerfile.worker -t {{.APP_NAME}}-worker:latest .

  docker-up:
    desc: Start infrastructure and services with docker-compose
    cmds:
      - docker compose -f deployments/docker-compose.yml up -d

  docker-down:
    desc: Stop and remove docker-compose containers
    cmds:
      - docker compose -f deployments/docker-compose.yml down

  infra-up:
    desc: Start infrastructure containers (PostgreSQL, Redis, Kafka)
    cmds:
      - docker compose -f deployments/docker-compose.yml up -d postgres redis kafka

  infra-down:
    desc: Stop infrastructure containers
    cmds:
      - docker compose -f deployments/docker-compose.yml stop postgres redis kafka

  infra-status:
    desc: Show status of infrastructure containers
    cmds:
      - docker compose -f deployments/docker-compose.yml ps postgres redis kafka

  infra-logs:
    desc: Tail logs of infrastructure containers
    cmds:
      - docker compose -f deployments/docker-compose.yml logs -f postgres redis kafka

  setup:
    desc: Run development environment setup script
    cmds:
      - ./scripts/setup.sh
