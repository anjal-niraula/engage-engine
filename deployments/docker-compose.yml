services:
  # ============================================================================
  # Infrastructure Services
  # ============================================================================
  mongo:
    image: mongo:7.0
    container_name: engage-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: engage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ENGAGE_DATABASE_USER:-${APP_DATABASE__USER:-postgres}}
      POSTGRES_PASSWORD: ${ENGAGE_DATABASE_PASSWORD:-${APP_DATABASE__PASSWORD:-postgres}}
      POSTGRES_DB: ${ENGAGE_DATABASE_NAME:-${APP_DATABASE__NAME:-engage_engine}}
    ports:
      - "${ENGAGE_DATABASE_PORT:-${APP_DATABASE__PORT:-5432}}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_initial_schema.up.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENGAGE_DATABASE_USER:-${APP_DATABASE__USER:-postgres}} -d ${ENGAGE_DATABASE_NAME:-${APP_DATABASE__NAME:-engage_engine}}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: engage-redis
    restart: unless-stopped
    ports:
      - "${ENGAGE_REDIS_PORT:-${REDIS_PORT:-6379}}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: engage-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================================
  # Application Services
  # ============================================================================
  api:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.api
    container_name: engage-api
    restart: unless-stopped
    ports:
      - "${APP_SERVER__PORT:-8080}:8080"
    env_file:
      - ../.env
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.worker
    container_name: engage-worker
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: engage-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  mongo_data:
  postgres_data:
  redis_data:
  kafka_data:

